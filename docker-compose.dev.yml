services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lar
      POSTGRES_PASSWORD: lar
      POSTGRES_DB: lar_dev
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lar
      POSTGRES_PASSWORD: lar
      POSTGRES_DB: lar_test
    ports: ["5433:5432"]
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  pgdata:
